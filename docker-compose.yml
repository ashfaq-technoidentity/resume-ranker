services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume_ranker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_ranker}
      POSTGRES_DB: ${POSTGRES_DB:-resume_ranker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_ranker} -d ${POSTGRES_DB:-resume_ranker}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resume_ranker}:${POSTGRES_PASSWORD:-resume_ranker}@db:5432/${POSTGRES_DB:-resume_ranker}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
